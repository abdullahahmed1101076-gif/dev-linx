

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dockerops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dockerops-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dockerops-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/dockerops
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - dockerops-net
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: dockerops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - dockerops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:

networks:
  dockerops-net:
    driver: bridge
